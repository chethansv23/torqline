server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: appointment-service
              uri: ${APPOINTMENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/appointments/**,/api/dealers/**
            - id: repair-order-service
              uri: ${REPAIR_ORDER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/repair-orders/**
            - id: parts-inventory-service
              uri: ${PARTS_INVENTORY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/parts/**,/api/reservations/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
