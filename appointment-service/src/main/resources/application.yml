server:
  port: 8081

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/appointment_db
    username: ${DB_USER:torqline}
    password: ${DB_PASSWORD:torqline}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all

torqline:
  cache:
    busy-slots-ttl: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # Losing a race for a bay surfaces as an expected exclusion-constraint violation; the service
    # handles it, so don't log each one as a warning.
    org.hibernate.orm.jdbc.error: ERROR
