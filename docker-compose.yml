name: torqline

x-service: &service
  restart: unless-stopped
  mem_limit: 512m
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_healthy }
    redis: { condition: service_healthy }
  environment: &service-env
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: torqline
      POSTGRES_PASSWORD: torqline
      POSTGRES_DB: torqline
    ports: ["5433:5432"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torqline -d inventory_db"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:29092 for containers, localhost:9092 for services started from your IDE
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:latest
    profiles: ["tools"]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: torqline
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka: { condition: service_healthy }

  appointment-service:
    <<: *service
    build: { context: ., args: { MODULE: appointment-service } }
    image: torqline/appointment-service
    ports: ["8081:8081"]
    healthcheck: &health
      test: ["CMD-SHELL", "curl -fs localhost:$$SERVER_PORT/actuator/health | grep -q UP"]
      interval: 10s
      start_period: 40s
      retries: 10
    environment:
      <<: *service-env
      SERVER_PORT: 8081

  repair-order-service:
    <<: *service
    build: { context: ., args: { MODULE: repair-order-service } }
    image: torqline/repair-order-service
    ports: ["8082:8082"]
    healthcheck: *health
    environment:
      <<: *service-env
      SERVER_PORT: 8082

  parts-inventory-service:
    <<: *service
    build: { context: ., args: { MODULE: parts-inventory-service } }
    image: torqline/parts-inventory-service
    ports: ["8083:8083"]
    healthcheck: *health
    environment:
      <<: *service-env
      SERVER_PORT: 8083

  notification-service:
    <<: *service
    build: { context: ., args: { MODULE: notification-service } }
    image: torqline/notification-service
    ports: ["8084:8084"]
    healthcheck: *health
    environment:
      <<: *service-env
      SERVER_PORT: 8084

  gateway:
    build: { context: ., args: { MODULE: gateway } }
    image: torqline/gateway
    restart: unless-stopped
    mem_limit: 384m
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      start_period: 30s
      retries: 12
    environment:
      APPOINTMENT_SERVICE_URL: http://appointment-service:8081
      REPAIR_ORDER_SERVICE_URL: http://repair-order-service:8082
      PARTS_INVENTORY_SERVICE_URL: http://parts-inventory-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      appointment-service: { condition: service_healthy }
      repair-order-service: { condition: service_healthy }
      parts-inventory-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }

  web:
    build: ./web
    image: torqline/web
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pgdata:
